
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tik Tok India</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }
    .video {
      margin: 15px;
      height: 65vh;
      background: #292929;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    button {
      background: #ff2455;
      color: white;
      padding: 12px 24px;
      border: 0;
      border-radius: 25px;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <header>🎵 Tik Tok India</header>
  <div class="video">
    <h2>आपका वीडियो फीड</h2>
    <p>जल्द ही यहाँ वीडियो दिखेंगे</p>
    <button onclick="alert('वीडियो फीचर जल्द आएगा!')">
      + वीडियो बनाएं
    </button>
  </div>
</body>
</html>
